server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evitar redirecciones absolutas con http:// detrás del proxy TLS de Cloud Run
    absolute_redirect off;
    port_in_redirect off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html =404;
    }
}
