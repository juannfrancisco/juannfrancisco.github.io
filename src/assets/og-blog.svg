<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Borde interior -->
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="#18181b" fill-opacity="0.55" stroke="#27272a" stroke-width="1.5"/>

  <!-- Marca superior -->
  <text x="104" y="130" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="600">
    juanfrancisco<tspan fill="#06b6d4">.dev</tspan><tspan fill="#71717a">/blog</tspan>
  </text>

  <!-- Título principal -->
  <text x="104" y="290" fill="#fafafa" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">
    Juan Francisco Maldonado
  </text>

  <!-- Subtítulo -->
  <text x="104" y="355" fill="url(#accent)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600">
    Arquitectura cloud, producto y equipos de software
  </text>

  <!-- Línea de acento -->
  <rect x="104" y="405" width="96" height="4" rx="2" fill="#06b6d4"/>

  <!-- Pie de tarjeta -->
  <text x="104" y="510" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22">
    Notas técnicas, decisiones de arquitectura y liderazgo de ingeniería
  </text>
</svg>
