<svg viewBox="0 0 1000 536" width="1000" height="536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boost-pipeline-title boost-pipeline-desc">
  <title id="boost-pipeline-title">Cómo funciona /boost</title>
  <desc id="boost-pipeline-desc">Pipeline de tres fases de /boost en Google Antigravity: el orquestador planifica, subagentes de implementación, investigación y verificación trabajan en paralelo, y la síntesis valida con tests, reintentando con los diagnósticos hasta entregar cambios verificados.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="#f8fafc"/>

  <!-- Zonas de fase -->
  <rect x="200" y="72" width="152" height="332" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="72" width="232" height="332" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="636" y="72" width="328" height="332" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="212" y="92" fill="#475569" font-size="8" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.16em">FASE 1 · ESTRATEGIA</text>
  <text x="392" y="92" fill="#475569" font-size="8" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.16em">FASE 2 · EJECUCIÓN PARALELA</text>
  <text x="648" y="92" fill="#475569" font-size="8" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.16em">FASE 3 · SÍNTESIS</text>
  <text x="496" y="384" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">worktrees efímeros aislados</text>

  <!-- Conectores (antes que los nodos) -->
  <line x1="176" y1="220" x2="212" y2="220" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- fan-out -->
  <path d="M340,206 H364 Q372,206 372,198 V148 Q372,140 380,140 H404" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="220" x2="404" y2="220" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M340,234 H364 Q372,234 372,242 V292 Q372,300 380,300 H404" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- fan-in -->
  <path d="M588,140 H612 Q620,140 620,148 V198 Q620,206 628,206 H652" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="588" y1="220" x2="652" y2="220" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M588,300 H612 Q620,300 620,292 V242 Q620,234 628,234 H652" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- síntesis → decisión -->
  <line x1="772" y1="220" x2="796" y2="220" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- SÍ → entrega (ruta feliz) -->
  <line x1="856" y1="260" x2="856" y2="332" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- NO → reintento -->
  <path d="M916,220 H940 Q948,220 948,228 V432 Q948,440 940,440 H284 Q276,440 276,432 V248" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Etiquetas de conectores -->
  <rect x="864" y="290" width="24" height="12" rx="2" fill="#ffffff"/>
  <text x="876" y="299" fill="#0369a1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">SÍ</text>
  <rect x="920" y="202" width="24" height="12" rx="2" fill="#ffffff"/>
  <text x="932" y="211" fill="#475569" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>
  <rect x="532" y="422" width="160" height="12" rx="2" fill="#f8fafc"/>
  <text x="612" y="431" fill="#475569" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">DIAGNÓSTICO → RONDA N+1</text>

  <!-- Inicio -->
  <rect x="40" y="196" width="136" height="48" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="108" y="217" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Tu prompt</text>
  <text x="108" y="232" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">/boost &lt;tarea&gt;</text>

  <!-- Fase 1 -->
  <rect x="212" y="192" width="128" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="276" y="217" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Orquestador</text>
  <text x="276" y="233" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">plan + subtareas</text>

  <!-- Fase 2 -->
  <rect x="404" y="112" width="184" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="496" y="137" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Implementación</text>
  <text x="496" y="153" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">código · refactor · tests</text>

  <rect x="404" y="192" width="184" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="496" y="217" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Investigación</text>
  <text x="496" y="233" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">root cause · solo lectura</text>

  <rect x="404" y="272" width="184" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="496" y="297" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Verificación local</text>
  <text x="496" y="313" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">build + test suites</text>

  <!-- Fase 3 -->
  <rect x="652" y="192" width="120" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="712" y="217" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Síntesis</text>
  <text x="712" y="233" fill="#475569" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">regresión + bordes</text>

  <polygon points="856,180 916,220 856,260 796,220" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="856" y="224" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">¿Tests pasan?</text>

  <rect x="776" y="332" width="160" height="56" rx="20" fill="rgba(64,181,231,0.12)" stroke="#0284c7" stroke-width="1.2"/>
  <text x="856" y="357" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Entrega verificada</text>
  <text x="856" y="373" fill="#0369a1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">resumen + cambios</text>

  <!-- Leyenda -->
  <line x1="40" y1="476" x2="960" y2="476" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="40" y="492" fill="#475569" font-size="8" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.16em">LEYENDA</text>
  <rect x="40" y="504" width="24" height="12" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="72" y="514" fill="#475569" font-size="9" font-family="'Inter', system-ui, sans-serif">Inicio / fin</text>
  <rect x="200" y="504" width="24" height="12" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="232" y="514" fill="#475569" font-size="9" font-family="'Inter', system-ui, sans-serif">Paso / subagente</text>
  <polygon points="388,510 400,504 412,510 400,516" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <text x="420" y="514" fill="#475569" font-size="9" font-family="'Inter', system-ui, sans-serif">Decisión</text>
  <line x1="540" y1="510" x2="568" y2="510" stroke="#0284c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="576" y="514" fill="#475569" font-size="9" font-family="'Inter', system-ui, sans-serif">Ruta de entrega</text>
  <line x1="704" y1="510" x2="732" y2="510" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="740" y="514" fill="#475569" font-size="9" font-family="'Inter', system-ui, sans-serif">Iteración automática</text>
</svg>
